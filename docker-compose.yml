services:
  lpw:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: local-packet-whisperer
    environment:
      # OpenAI API Key - set this if using OpenAI or compatible API
      - OPENAI_API_KEY=${OPENAI_API_KEY:-token-abc123}
      # LLM Server settings
      - LLM_SERVER=${LLM_SERVER:-127.0.0.1}
      - LLM_SERVER_PORT=${LLM_SERVER_PORT:-11434}
      # Streamlit file upload size limit (in MB)
      - STREAMLIT_SERVER_MAXUPLOADSIZE=500
    ports:
      - 8501:8501
    volumes:
      # Persist application data
      - lpw-data:/root/.lpw
    restart: unless-stopped

  # # Optional: Ollama service for local LLM
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   restart: unless-stopped
  #   networks:
  #     - lpw-network
  #   # Uncomment below for GPU support (requires nvidia-docker)
  #   # deploy:
  #   #   resources:
  #   #     reservations:
  #   #       devices:
  #   #         - driver: nvidia
  #   #           count: 1
  #   #           capabilities: [gpu]

volumes:
  lpw-data:

networks:
  lpw-network:
    driver: bridge
