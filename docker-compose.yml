services:
  lpw:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: local-packet-whisperer
    ports:
      - "8501:8501"
    environment:
      # OpenAI API Key - set this if using OpenAI or compatible API
      - OPENAI_API_KEY=${OPENAI_API_KEY:-not-needed}
      # LLM Server settings
      - LLM_SERVER=${LLM_SERVER:-127.0.0.1}
      - LLM_SERVER_PORT=${LLM_SERVER_PORT:-11434}
    volumes:
      # Persist application data
      - lpw-data:/root/.lpw
      # Mount local pcap files (optional)
      - ${PCAP_DIR:-./pcaps}:/pcaps:ro
    restart: unless-stopped
    networks:
      - lpw-network

  # Optional: Ollama service for local LLM
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    networks:
      - lpw-network
    # Uncomment below for GPU support (requires nvidia-docker)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  lpw-data:
  ollama-data:

networks:
  lpw-network:
    driver: bridge
